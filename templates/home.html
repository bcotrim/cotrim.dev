<!-- wp:group {"tagName":"main","className":"con-page","layout":{"type":"default"}} -->
<main class="wp-block-group con-page">

	<!-- wp:shortcode -->
	[con_archive_header]
	<!-- /wp:shortcode -->

	<!-- wp:html -->
	<div class="con-filter" data-con-filter>
		<span class="label">filter:</span>
		<button type="button" class="con-chip is-active" data-filter="all">[all]</button>
		<button type="button" class="con-chip" data-filter="essay">[essay]</button>
		<button type="button" class="con-chip" data-filter="note">[note]</button>
		<button type="button" class="con-chip" data-filter="link">[link]</button>
	</div>
	<!-- /wp:html -->

	<!-- wp:html -->
	<hr class="con-rule con-rule--tight" />
	<!-- /wp:html -->

	<!-- wp:shortcode -->
	[con_archive_list]
	<!-- /wp:shortcode -->

	<!-- wp:html -->
	<p class="con-inline-prompt">
		<a href="/feed/"><span class="sign">~$</span> <span class="cmd">cat feed.xml</span> <span class="note"># RSS available</span></a>
	</p>
	<!-- /wp:html -->

</main>
<!-- /wp:group -->
